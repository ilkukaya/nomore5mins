name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rebuild keeps "updated" dates and the sitemap fresh.
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
      PUBLIC_ADSENSE_SLOT_TOP: ${{ vars.PUBLIC_ADSENSE_SLOT_TOP }}
      PUBLIC_ADSENSE_SLOT_CONTENT: ${{ vars.PUBLIC_ADSENSE_SLOT_CONTENT }}
      PUBLIC_ADSENSE_SLOT_BOTTOM: ${{ vars.PUBLIC_ADSENSE_SLOT_BOTTOM }}
      PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
      PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
      PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
      PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}
      PUBLIC_YANDEX_VERIFICATION: ${{ vars.PUBLIC_YANDEX_VERIFICATION }}
      PUBLIC_AMAZON_TAGS: ${{ vars.PUBLIC_AMAZON_TAGS }}
      PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
      PUBLIC_SOCIAL_PROFILES: ${{ vars.PUBLIC_SOCIAL_PROFILES }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Deploy to Netlify
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.NETLIFY_AUTH_TOKEN != ''
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './dist'
          production-branch: main
          production-deploy: true
          enable-pull-request-comment: false
          enable-commit-comment: false
